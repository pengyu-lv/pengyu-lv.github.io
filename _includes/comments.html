{%- comment -%}
  giscus 评论框。四项配置没填齐时整块不渲染，
  所以 _config.yml 留空也不会报错。
{%- endcomment -%}
{%- assign g = site.giscus -%}
{%- if g.repo and g.repo != "" and g.repo_id and g.repo_id != "" and g.category_id and g.category_id != "" -%}
<section class="comments" style="margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #e8e8e8;">
  <h2 style="font-size: 1.25rem;">评论</h2>
  <script src="https://giscus.app/client.js"
          data-repo="{{ g.repo }}"
          data-repo-id="{{ g.repo_id }}"
          data-category="{{ g.category }}"
          data-category-id="{{ g.category_id }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme"
          data-lang="zh-CN"
          data-loading="lazy"
          crossorigin="anonymous"
          async>
  </script>
  <noscript>评论需要启用 JavaScript。</noscript>
</section>
{%- endif -%}
