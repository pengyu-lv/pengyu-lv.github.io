# ============================================================
#  网站总配置 —— 只有标了【必改】的地方需要动
# ============================================================

# ----------【必改 1】网站名字 ----------
title: 我的博客

# ----------【必改 2】网站描述 ----------
description: >-
  记录学习、写作与生活。

# ----------【必改 3】你的网址 ----------
# 情况 A：仓库名是 你的用户名.github.io
url: "https://你的用户名.github.io"
baseurl: ""

# 情况 B：仓库名是别的名字，比如 mypage
# url: "https://你的用户名.github.io"
# baseurl: "/mypage"

lang: zh-CN
author: 你的名字
email: you@example.com

# ============================================================
#  以下通常不用改
# ============================================================

plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true

header_pages:
  - about.md

# ----------【选填】评论区 ----------
# 留空 = 不显示评论，网站照常工作
giscus:
  repo: ""
  repo_id: ""
  category: "Announcements"
  category_id: ""
