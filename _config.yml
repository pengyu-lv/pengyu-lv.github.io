# ============================================================
#  这个文件是整个网站的总开关，改完推送就生效
#  只有下面标了【必改】的地方需要动，其余不用管
# ============================================================

# ----------【必改 1】网站名字（浏览器标签页显示这个）----------
title: 我的博客

# ----------【必改 2】网站描述（搜索结果里显示）----------
description: >-
  记录学习、写作与生活。

# ----------【必改 3】你的网址 ----------
# 情况 A：仓库名是 你的用户名.github.io（推荐新手）
url: "https://pengyu-lv.github.io/"
baseurl: ""

# 情况 B：仓库名是别的名字，比如 mypage
# 那么上面两行要改成：
# url: "https://你的用户名.github.io"
# baseurl: "/mypage"
#
# ⚠️ baseurl 写错 = 全站没样式、链接全 404，这是最常见的坑

author: 你的名字
email: you@example.com

# ============================================================
#  以下不用改
# ============================================================

theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true

minima:
  date_format: "%Y-%m-%d"

header_pages:
  - about.md

# ----------【选填】评论区 ----------
# 留空 = 不显示评论，网站照常工作
# 想开评论就按《配置指南.md》第 6 步，把 3 个值填进来
giscus:
  repo: ""
  repo_id: ""
  category: "Announcements"
  category_id: ""
