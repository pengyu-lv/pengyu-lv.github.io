# ============================================================
#  网站总配置
# ============================================================

# ----------【必改 1】网站名字 ----------
title: 我的博客

# ----------【必改 2】网站描述 ----------
description: >-
  记录学习、写作与生活。

# ----------【必改 3】你的网址 ----------
url: "https://pengyu-lv.github.io"
baseurl: ""

lang: zh-CN
author: pengyu
email: pengyu.lv@ptmind.com

# ============================================================
#  以下通常不用改
# ============================================================

plugins:
  - jekyll-feed
  - jekyll-seo-tag

show_excerpts: true

header_pages:
  - about.md

# ---------- 文章默认布局 ----------
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# ----------【选填】评论区 ----------
# 留空 = 不显示评论，网站照常工作
giscus:
  repo: ""
  repo_id: ""
  category: "Announcements"
  category_id: ""
