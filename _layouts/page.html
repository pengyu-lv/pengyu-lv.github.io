---
layout: default
---
<div class="wrapper">
  <article class="post">
    {%- if page.title -%}
      <header class="post-header">
        <h1 class="post-title">{{ page.title | escape }}</h1>
      </header>
      <hr class="post-divider">
    {%- endif -%}

    <div class="post-content">
      {{ content }}
    </div>
  </article>
</div>
